services:
  - type: web
    name: health-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn health_tracker.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthtracker
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: health-tracker.onrender.com