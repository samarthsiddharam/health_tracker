# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: "2401008"

---

# ============================================================
# PersistentVolumeClaim (for static files)
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc
  namespace: "2401008"
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-tracker-deployment
  namespace: "2401008"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-tracker
  template:
    metadata:
      labels:
        app: health-tracker
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: health-tracker
          image: 127.0.0.1:30085/2401008-project/health-tracker-2401008-v2:latest

          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          # ------------------------------
          # POSTGRES ENV VARIABLES
          # ------------------------------
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_PORT

            - name: DEBUG
              value: "0"

          # ------------------------------
          # HEALTH CHECKS
          # ------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

          # ------------------------------
          # STATIC FILE STORAGE
          # ------------------------------
          volumeMounts:
            - name: static-media
              mountPath: /app/static

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

      volumes:
        - name: static-media
          persistentVolumeClaim:
            claimName: static-pvc

---

# ============================================================
# Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: health-tracker-service
  namespace: "2401008"
spec:
  selector:
    app: health-tracker
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---

# ============================================================
# Ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-tracker-ingress
  namespace: "2401008"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: health-tracker.imcc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: health-tracker-service
                port:
                  number: 8000
