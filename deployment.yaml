# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: "2401008"

---
# ============================================================
# Deployment (NO PVC!)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "health-tracker-deployment"
  namespace: "2401008"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-tracker
  template:
    metadata:
      labels:
        app: health-tracker
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: health-tracker
          image: 127.0.0.1:30085/2401008_sam/static-site:latest
          ports:
            - containerPort: 80
          # ❌ REMOVE THIS — no PVC mapping
          # volumeMounts:
          #   - name: static-media
          #     mountPath: /usr/share/nginx/html

      # ❌ REMOVE THIS ALSO — it hides all your HTML files
      # volumes:
      #   - name: static-media
      #     persistentVolumeClaim:
      #       claimName: "static-pvc"

---
# ============================================================
# Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: "health-tracker-service"
  namespace: "2401008"
spec:
  selector:
    app: health-tracker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# ============================================================
# Ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "health-tracker-ingress"
  namespace: "2401008"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: health-tracker.imcc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: static-site-service
                port:
                  number: 80

